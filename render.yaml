# Despliegue en Render (Blueprint): base PostgreSQL, backend FastAPI y frontend estatico.
# En Render: New > Blueprint > elegir este repositorio.
databases:
  - name: finanzas-tpfinal-db
    plan: free
    databaseName: finanzas
    user: finanzas

services:
  - type: web
    name: finanzas-tpfinal-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # Aplica las migraciones y carga las categorias antes de iniciar
    startCommand: alembic upgrade head && python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_URL
        fromDatabase:
          name: finanzas-tpfinal-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://finanzas-tpfinal-web.onrender.com
      - key: LLM_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai
      - key: LLM_MODEL
        value: gemini-2.5-flash
      # Se completa en Render al crear el Blueprint (no se versiona)
      - key: LLM_API_KEY
        sync: false

  - type: web
    name: finanzas-tpfinal-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://finanzas-tpfinal-api.onrender.com
    # Las rutas de React Router se resuelven en el navegador
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
